server:
  port: 8081
spring:
  application:
    name: uniticket
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/uniticket?useSSL=false&useUnicode=true&characterEncoding=utf-8
    username: root
    password:
  redis:
    host: 127.0.0.1
    port: 6379
    password: MyPassword! 
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  kafka:
    bootstrap-servers: 127.0.0.1:19092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
    consumer:
      group-id: seckill-order-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      enable-auto-commit: false
      properties:
        spring.json.trusted.packages: com.uniticket.entity
        spring.json.value.default.type: com.uniticket.entity.TicketOrder
        spring.json.use.type.headers: false
    listener:
      ack-mode: manual
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
mybatis-plus:
  type-aliases-package: com.uniticket.entity # 别名扫描包
logging:
  level:
    com.uniticket: debug
order:
  payment-timeout-minutes: 15
  timeout-scan-batch-size: 200
kafka:
  topic:
    seckill-order: seckill-order
    order-timeout: order-timeout
rate-limit:
  seckill:
    capacity: 200
    refill-per-second: 200
  coupon:
    window-ms: 60000
    max-requests: 5
  venue:
    window-ms: 10000
    max-requests: 30
